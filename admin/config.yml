backend:
  name: git-gateway
  branch: main

# Indique où enregistrer les images sur GitHub
media_folder: "images/uploads"   # Dossier dans ton dépôt GitHub où s'enregistrent les images
public_folder: "images/uploads"  # Chemin que le site va utiliser pour lire l'image (sans le slash / au début pour éviter les conflits)

collections:
  - name: "artistes"
    label: "Artistes"
    folder: "_artistes"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Nom de l'artiste"
        name: "title"
        widget: "string"
        
      - label: "TAG"
        name: "tag"
        widget: "select"
        options:
          - "DESIGN."
          - "ART."
          - "MODE."
          - "ARCHITECTURE. SPACE."
          - "FOURNITURES."
      
      # C'est cette ligne essentielle qui crée le bouton d'ajout d'image :
      - label: "Image Principale"
        name: "image_principale"
        widget: "image"
      
      - label: "Biographie"
        name: "body"
        widget: "markdown"

